<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A hand-drawn hamster adventure. Scurry, jump, and leave a little echo of yourself.">
  <title>Echoes — A Little Hamster Adventure</title>
  <link rel="stylesheet" href="/src/theme-type.css">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="game" aria-label="Echoes, a hand-drawn hamster platform adventure">
    <canvas id="game" tabindex="0" role="application" aria-label="Hamster platform adventure. Left and Right to run, Space to jump, E to leave an Echo, R to retry."></canvas>
    <header class="hud">
      <div class="identity"><span class="wordmark">echoes</span><span class="ink-divider" aria-hidden="true"></span><h1 id="room-name">The Meadow Path</h1></div>
      <nav aria-label="Game tools"><button id="help-button" class="icon-button" title="How to play" aria-label="How to play">?</button><button id="menu-button" class="icon-button" title="Pause" aria-label="Pause game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button></nav>
    </header>
    <p id="cue" class="cue" role="status" aria-live="polite">← → to scurry · Space to jump</p>
    <div class="echo-control"><div class="echo-create"><div id="echo-slots" class="echo-slots" role="img" aria-label="2 of 2 Echo slots available" title="2 of 2 Echo slots available"><i class="available" aria-hidden="true"></i><i class="available" aria-hidden="true"></i></div><button id="echo-button" class="echo-button" title="Echo your footsteps (E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a3 3 0 1 1 4-4m4 0a3 3 0 1 1 4 4M5 12c0-5 14-5 14 0v5c0 5-14 5-14 0Z"/><path d="M9 14v1m6-1v1"/></svg><span>Echo</span><kbd>E</kbd></button></div><button id="vanish-echo-button" class="echo-button vanish-button" title="Vanish Echoes and free both slots (Q)" disabled><span>Vanish Echo</span><kbd>Q</kbd></button></div>
    <div class="touch-controls" aria-label="Touch controls">
      <div class="touch-walk" role="group" aria-label="Run"><button data-hold="left" aria-label="Run left">←</button><button data-hold="right" aria-label="Run right">→</button></div>
      <button id="jump-button" class="jump-button" aria-label="Jump">↑</button>
    </div>
  </main>
  <dialog id="menu-dialog" class="paper-dialog" aria-labelledby="menu-title">
    <button class="dialog-close" data-close="menu-dialog" aria-label="Close menu">×</button>
    <h2 id="menu-title">Paused.</h2>
    <button class="primary-button" data-close="menu-dialog">Resume <span>→</span></button>
    <button id="restart-all-button" class="menu-button" title="Restart all levels from the beginning">Restart <span>↶</span></button>
    <button id="sound-button" class="menu-button" aria-pressed="false">Sound <span>off</span></button>
    <div class="room-picker" role="group" aria-label="Choose a trail" id="room-picker"></div>
  </dialog>
  <dialog id="help-dialog" class="paper-dialog" aria-labelledby="help-title">
    <button class="dialog-close" data-close="help-dialog" aria-label="Close help">×</button>
    <h2 id="help-title">Controls</h2>
    <div class="keyboard-help"><span>Run <kbd>← →</kbd> / <kbd>A D</kbd></span><span>Walk <kbd>Shift + ← →</kbd></span><span>Jump <kbd>Space</kbd> / <kbd>W ↑</kbd></span><span>Echo <kbd>E</kbd></span><span>Vanish Echoes <kbd>Q</kbd></span><span>Retry <kbd>R</kbd></span></div>
    <div id="level-hints" aria-label="Hints for this trail"></div>
    <button class="primary-button" data-close="help-dialog">Let's explore <span>→</span></button>
  </dialog>
  <dialog id="win-dialog" class="paper-dialog win-dialog" aria-labelledby="win-title">
    <div class="win-doodle" aria-hidden="true">✳</div><span class="eyebrow">A LITTLE MEMORY FOUND</span><h2 id="win-title">You were there for you.</h2><p id="win-copy">Another little corner of the world is waiting.</p>
    <button id="next-button" class="primary-button">Keep wandering <span>→</span></button><button id="replay-button" class="text-button">Explore this trail again</button>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
